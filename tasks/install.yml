---
- name: Install PHP and extensions for {{ php_version }}
  ansible.builtin.apt:
    name: "{{ __php_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  notify: php_restart_fpm

- name: Enable and start PHP-FPM {{ php_version }}
  ansible.builtin.service:
    name: php{{ php_version }}-fpm
    state: started
    enabled: true
