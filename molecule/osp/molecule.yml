---
# osp-ansible's values. maximum_upload_size_mb is vaulted there; 100 is a stand-in.
provisioner:
  inventory:
    host_vars:
      instance:
        php_version: "8.5"
        php_extensions: [bcmath, curl, dom, gd, intl, mbstring, mysql, xml, zip]
        php_ini:
          # was osp_config.ini
          upload_max_filesize: 100M
          post_max_size: 100M
          opcache.enable: 1
          opcache.memory_consumption: 256
          opcache.interned_strings_buffer: 16
          opcache.max_accelerated_files: 20000
          opcache.validate_timestamps: 0
          opcache.save_comments: 1
        php_ini_legacy_files: [osp_config.ini]
        # was osp_pool.conf.j2
        php_fpm_pool:
          pm.max_children: 75
          pm.start_servers: 10
          pm.min_spare_servers: 5
          pm.max_spare_servers: 25
          pm.process_idle_timeout: 10s
          pm.max_requests: 500

        verify_php_version: "8.5"
        verify_min_version: "8.5.12"
        verify_packages: [php8.5, php8.5-fpm, php8.5-cli, php8.5-common, php8.5-bcmath, php8.5-curl,
                          php8.5-gd, php8.5-intl, php8.5-mbstring, php8.5-mysql, php8.5-xml, php8.5-zip]
        verify_ini:
          upload_max_filesize: 100M
          post_max_size: 100M
          opcache.enable: "1"
          opcache.memory_consumption: "256"
          opcache.interned_strings_buffer: "16"
          opcache.max_accelerated_files: "20000"
          opcache.validate_timestamps: "0"
          opcache.save_comments: "1"
        verify_legacy_files: [osp_config.ini]
        verify_pool:
          user: www-data
          group: www-data
          listen: /run/php/php8.5-fpm.sock
          listen.owner: www-data
          listen.group: www-data
          pm: dynamic
          pm.max_children: 75
          pm.start_servers: 10
          pm.min_spare_servers: 5
          pm.max_spare_servers: 25
          pm.process_idle_timeout: 10s
          pm.max_requests: 500
