---
# coip-ansible's values (roles/php at b77fa07). The pool was never managed there, so it stays stock.
provisioner:
  inventory:
    host_vars:
      instance:
        test_old_sources: true
        php_version: "8.5"
        php_extensions: [bcmath, curl, gd, intl, mbstring, pgsql, xml, zip]
        php_ini:
          # was 99-laravel-performance.ini (opcache.fast_shutdown dropped: removed in PHP 7.2)
          opcache.enable: 1
          opcache.jit: 1255
          opcache.jit_buffer_size: 64M
          opcache.revalidate_freq: 0
          opcache.validate_timestamps: 1
          opcache.max_accelerated_files: 10000
          opcache.memory_consumption: 192
          opcache.max_wasted_percentage: 10
          opcache.interned_strings_buffer: 16
          # was 99-uploads.ini
          upload_max_filesize: 250M
          post_max_size: 260M
          max_input_time: 300
          max_execution_time: 300
        php_ini_legacy_files: [99-laravel-performance.ini, 99-uploads.ini]

        verify_php_version: "8.5"
        verify_min_version: "8.5.12"
        verify_packages: [php8.5, php8.5-fpm, php8.5-cli, php8.5-common, php8.5-bcmath, php8.5-curl,
                          php8.5-gd, php8.5-intl, php8.5-mbstring, php8.5-pgsql, php8.5-xml, php8.5-zip]
        verify_ini:
          opcache.enable: "1"
          opcache.jit: "1255"
          opcache.jit_buffer_size: 64M
          opcache.revalidate_freq: "0"
          opcache.validate_timestamps: "1"
          opcache.max_accelerated_files: "10000"
          opcache.memory_consumption: "192"
          opcache.max_wasted_percentage: "10"
          opcache.interned_strings_buffer: "16"
          upload_max_filesize: 250M
          post_max_size: 260M
          max_input_time: "300"
          max_execution_time: "300"
        verify_legacy_files: [99-laravel-performance.ini, 99-uploads.ini]
        verify_pool:
          user: www-data
          group: www-data
          listen: /run/php/php8.5-fpm.sock
          listen.owner: www-data
          listen.group: www-data
          pm: dynamic
          pm.max_children: 5
          pm.start_servers: 2
          pm.min_spare_servers: 1
          pm.max_spare_servers: 3
