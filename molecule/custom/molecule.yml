---
# Every override at once, on PHP 8.4: extensions, ini (booleans, sizes, CLI-forced keys),
# a pool run by another user, legacy ini cleanup and old PPA/sury source cleanup.
provisioner:
  inventory:
    host_vars:
      instance:
        test_users: [deploy]
        test_old_sources: true
        php_version: "8.4"
        php_extensions: [bcmath, curl, dom, gd, intl, mbstring, pgsql, redis, xml, zip]
        php_ini:
          upload_max_filesize: 250M
          post_max_size: 260M
          max_execution_time: 300
          opcache.enable: true
          opcache.validate_timestamps: false
          opcache.memory_consumption: 192
        php_ini_legacy_files: [99-old-uploads.ini, old_config.ini]
        php_fpm_pool:
          user: deploy
          group: www-data
          pm.max_children: 20
          pm.max_requests: 500

        verify_php_version: "8.4"
        verify_min_version: "8.4.27"
        verify_packages: [php8.4, php8.4-fpm, php8.4-cli, php8.4-common, php8.4-bcmath, php8.4-curl,
                          php8.4-gd, php8.4-intl, php8.4-mbstring, php8.4-pgsql, php8.4-redis, php8.4-xml,
                          php8.4-zip]
        verify_ini:
          upload_max_filesize: 250M
          post_max_size: 260M
          max_execution_time: "300"
          opcache.enable: "1"
          opcache.validate_timestamps: "0"
          opcache.memory_consumption: "192"
        verify_legacy_files: [99-old-uploads.ini, old_config.ini]
        verify_pool:
          user: deploy
          group: www-data
          listen: /run/php/php8.4-fpm.sock
          listen.owner: www-data
          listen.group: www-data
          pm: dynamic
          pm.max_children: 20
          pm.start_servers: 2
          pm.min_spare_servers: 1
          pm.max_spare_servers: 3
          pm.max_requests: 500
