---
# Role defaults only.
provisioner:
  inventory:
    host_vars:
      instance:
        verify_php_version: "8.5"
        verify_min_version: "8.5.12"
        verify_packages: [php8.5, php8.5-fpm, php8.5-cli, php8.5-common, php8.5-bcmath, php8.5-curl,
                          php8.5-gd, php8.5-intl, php8.5-mbstring, php8.5-xml, php8.5-zip]
        verify_ini: {}
        verify_pool:
          user: www-data
          group: www-data
          listen: /run/php/php8.5-fpm.sock
          listen.owner: www-data
          listen.group: www-data
          pm: dynamic
          pm.max_children: 5
          pm.start_servers: 2
          pm.min_spare_servers: 1
          pm.max_spare_servers: 3
