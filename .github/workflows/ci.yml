---
name: CI

"on":
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - run: yamllint .
      - run: ansible-lint
      - name: Check README matches meta/argument_specs.yml
        run: |
          aar-doc . markdown
          git diff --exit-code README.md || {
            echo "::error::README.md is out of date. Run 'aar-doc . markdown' and commit the result."
            exit 1
          }

  molecule:
    needs: lint
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      # Role defaults on every supported release; each consuming repo's values on noble.
      matrix:
        include:
          - {scenario: default, distro: ubuntu2204}
          - {scenario: default, distro: ubuntu2404}
          - {scenario: default, distro: ubuntu2604}
          - {scenario: coip, distro: ubuntu2404}
          - {scenario: osp, distro: ubuntu2404}
          - {scenario: forge, distro: ubuntu2404}
    steps:
      - uses: actions/checkout@v5
        with:
          path: ansible-role-php
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install -r ansible-role-php/requirements-dev.txt
      - run: molecule test -s ${{ matrix.scenario }}
        working-directory: ansible-role-php
        env:
          MOLECULE_DISTRO: ${{ matrix.distro }}
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"
